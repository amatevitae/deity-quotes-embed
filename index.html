<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>words of wisdom</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#211c25;color:#f3eaf5}body{font-family:Georgia,serif}.widget{padding:19px 22px 16px;min-height:210px;display:flex;flex-direction:column;gap:14px}.heading{color:#d7b6df;font:600 14px system-ui,sans-serif;letter-spacing:.04em;display:flex;justify-content:space-between}.quote{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-style:italic;font-size:clamp(17px,3.5vw,23px);line-height:1.5}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px}.note{color:#aa9cae;font:11px system-ui,sans-serif}button{background:transparent;color:#e2c9e8;border:1px solid #74627b;border-radius:8px;padding:8px 12px;cursor:pointer;font:12px system-ui,sans-serif}button:hover{background:#392e40}</style></head><body><section class="widget"><div class="heading"><span>✧ words of wisdom ✧</span><span>☾</span></div><div class="quote" id="quote" aria-live="polite"></div><div class="footer"><span class="note">a little reflection for today</span><button id="shuffle" type="button">⤨ new quote</button></div></section><script>const quotes=["growth does not require perfection.","you are allowed to begin again as often as you need.","the smallest act of kindness can change a day.","rest is a worthy part of progress.","your boundaries deserve to be respected.","there is wisdom in knowing when to wait.","be curious about what you have yet to learn.","change can be difficult and still be worthwhile.","give yourself room to become someone new.","you can honour the past while choosing a different future.","patience is a practice, not a personality trait.","not every question needs an answer today.","notice what brings you peace, and make room for it.","courage can be quiet.","you are allowed to celebrate small victories.","care for what matters to you.","listen carefully, including to yourself.","your time and attention are valuable.","take pride in the effort you make.","there is always more to discover."];let last=-1;function shuffle(){let i;do{i=Math.floor(Math.random()*quotes.length)}while(quotes.length>1&&i===last);last=i;document.getElementById('quote').textContent='“'+quotes[i]+'”'}document.getElementById('shuffle').addEventListener('click',shuffle);shuffle()</script></body></html>
